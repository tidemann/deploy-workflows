name: Build and deploy

# Reusable deploy route for st44 sites.
#
# Build the image in CI, push it to GHCR tagged by commit SHA, then send the
# compose file to the server on stdin, where the site's own deploy.sh installs
# it, pulls, recreates and gates on health. The GHCR package stays private: the
# registry credential lives on the host, in the deploy user's docker config, and
# never travels through this workflow. CI never ships image bytes to the server.
#
# One ssh call, on purpose. Each site's deploy key is installed with an SSH
# forced command (`restrict,command="/srv/apps/<app-name>/deploy.sh"`), so it
# can run that one script and nothing else: no `scp`, no `docker`, no shell,
# and no reaching into another site's directory. A leaked DEPLOY_KEY can
# therefore redeploy its own site and do nothing more.
#
# The command is still named in the ssh line even though the forced command
# overrides it. That is deliberate: the same workflow works whether or not the
# key has been tightened yet, so the workflow and the key can be switched in
# either order without a broken deploy in between.
#
# Calling repos pin this by tag (@v1), never by @main — see README.md.
#
# One repo does not call this: st44-home keeps its own copy in
# .github/workflows/deploy.yml, because it is a three-image stack and this builds
# one image. The two are twins, so a fix here — an action bump, a permissions
# tightening, an ssh change — very probably belongs there too, and the other way
# round. ST-53 and ST-59 both had to be applied twice.
#
# ST-63 decided to extend this workflow to N images "later", triggered by a fourth
# repo needing the deploy path or by the third fix that has to land in both copies.

on:
  workflow_call:
    inputs:
      app-name:
        description: >-
          Short name of the site. Used for the GHCR image name, the compose
          service and container name, the default remote directory and the
          concurrency group. Example: food-st44.
        required: true
        type: string
      site-host:
        description: >-
          Public hostname the site must answer on, without scheme.
          Example: food.st44.no.
        required: true
        type: string
      remote-dir:
        description: >-
          Directory on the server that holds the compose file.
          Defaults to /srv/apps/<app-name>/infra.
        required: false
        type: string
        default: ""
      deploy-script:
        description: >-
          Path to the site's deploy.sh on the server — the forced command its
          deploy key may run. It reads a compose file on stdin, installs it,
          pulls, recreates and gates on health.
          Defaults to /srv/apps/<app-name>/deploy.sh.
        required: false
        type: string
        default: ""
      compose-file:
        description: Path to the compose file in the calling repository.
        required: false
        type: string
        default: infra/docker-compose.yml
      image-tag:
        description: >-
          Tag to publish and deploy. Defaults to the full commit SHA, which is
          what makes a deploy identifiable and rollback-able. Override only for
          a deliberate re-tag.
        required: false
        type: string
        default: ""
    secrets:
      DEPLOY_KEY:
        description: Private SSH key for the deploy user on the server.
        required: true
      SERVER_HOST:
        description: Hostname or IP of the server.
        required: true
      SERVER_USER:
        description: Deploy user on the server.
        required: true

# Least privilege at the top; the build job adds packages:write for GHCR.
permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.app-name }}
  cancel-in-progress: false

jobs:
  # Build once. The deploy job promotes this exact tag — it never rebuilds.
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Named once, so no later step has to re-derive it and get it subtly wrong.
      - name: Image identity
        id: identity
        run: |
          set -euo pipefail
          tag='${{ inputs.image-tag }}'
          [ -n "$tag" ] || tag="$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app-name }}:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN publishes into the calling repository's own package
      # namespace. A package created this way is private by default and stays
      # private unless someone changes it by hand — which is the point here.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.identity.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.site-host }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      SITE_HOST: ${{ inputs.site-host }}
      APP_NAME: ${{ inputs.app-name }}
      COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve the remote paths
        run: |
          set -euo pipefail
          dir='${{ inputs.remote-dir }}'
          [ -n "$dir" ] || dir="/srv/apps/${APP_NAME}/infra"
          script='${{ inputs.deploy-script }}'
          [ -n "$script" ] || script="/srv/apps/${APP_NAME}/deploy.sh"
          echo "REMOTE_DIR=$dir" >> "$GITHUB_ENV"
          echo "DEPLOY_SCRIPT=$script" >> "$GITHUB_ENV"
          echo "$dir"
          echo "$script"

      # One ssh alias, so the host and user are named once and no later step has
      # to re-interpolate a secret into a command line.
      - name: Configure ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # StrictHostKeyChecking=yes, so a swapped host key fails the deploy
          # rather than silently trusting a new one.
          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      # The compose file names the image as ${IMAGE}. The host's deploy.sh reads
      # the compose file on stdin and writes it into infra/, and it cannot see a
      # runner-side .env — so render the concrete image into the file here, and
      # the immutable per-commit tag still travels with the deploy.
      - name: Render the deploy compose file
        run: |
          set -euo pipefail
          test -f "${COMPOSE_FILE_PATH}" || {
            echo "::error::compose file not found in this repository: ${COMPOSE_FILE_PATH}"
            exit 1
          }
          # Resolve ${IMAGE:?...} and plain ${IMAGE} to the pushed tag.
          sed -e "s|\${IMAGE:?[^}]*}|${IMAGE}|g" -e "s|\${IMAGE}|${IMAGE}|g" \
            "${COMPOSE_FILE_PATH}" > deploy-compose.yml
          test -s deploy-compose.yml

      # Everything the host needs is in the compose file, so this is the whole
      # deploy: ship it on stdin, and the site's deploy.sh installs it, keeps the
      # previous one as docker-compose.yml.prev, pulls, recreates, prints the
      # container state and runs the health gate. It exits non-zero if the
      # container does not answer, which fails this job. Its output names the
      # image it replaced — that is the rollback anchor.
      - name: Deploy
        run: |
          set -euo pipefail
          # SC2029: the expansion is meant to happen here, on the runner.
          # shellcheck disable=SC2029
          if ! ssh deploy-target "${DEPLOY_SCRIPT}" < deploy-compose.yml | tee deploy.log; then
            echo "::error::the deploy script on the host failed — see the log above"
            exit 1
          fi

      # Only true once the proxy has a vhost and a valid certificate for the
      # hostname. A green container is not a finished deploy.
      - name: Verify https://<site-host>/healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            # curl already reports 000 for a connection or TLS failure; `|| true`
            # only stops `set -e` from aborting the retry loop.
            code="$(curl -sS -o body.txt -w '%{http_code}' "https://${SITE_HOST}/healthz" || true)"
            if [ "$code" = "200" ] && [ "$(tr -d '[:space:]' < body.txt)" = "ok" ]; then
              echo "public healthz: 200 ok over valid TLS"
              exit 0
            fi
            echo "attempt $i: http=$code"
            sleep 10
          done
          echo "::error::https://${SITE_HOST}/healthz did not return 200 ok with valid TLS"
          curl -sSv "https://${SITE_HOST}/healthz" || true
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${APP_NAME} deploy"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${{ needs.build.outputs.digest }}\`"
            echo "- Remote path: \`${REMOTE_DIR}\`"
            echo "- Deploy script (forced command): \`${DEPLOY_SCRIPT}\`"
            echo "- Public health check: https://${SITE_HOST}/healthz"
            echo "- Previous image (rollback anchor):"
            echo '```'
            grep '^previous-image:' deploy.log 2>/dev/null || echo 'previous-image: unknown (the deploy did not get that far)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
